[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxdepth"
version = "0.1.0"
description = "Pixel-Space Modeling for Structure Preserving Monocular Depth Estimation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.urls]
Repository = "https://github.com/yuanzhy29/PXDepth"

[tool.setuptools.packages.find]
where = ["."]
include = ["pxdepth*"]

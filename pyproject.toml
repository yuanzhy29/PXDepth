[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxdepth"
version = "0.1.0"
description = "PXDepth: Pixel-Space Modeling for Structure Preserving Monocular Depth Estimation"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Zhiyuan Yuan" },
    { name = "Guanying Chen" },
    { name = "Lingteng Qiu" },
    { name = "Ruimao Zhang" },
    { name = "Shuguang Cui" },
    { name = "Xiaochun Cao" },
]

keywords = [
    "monocular-depth-estimation",
    "depth-estimation",
    "computer-vision",
    "3d-reconstruction",
    "pytorch",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # PyTorch
    "torch>=2.6,<=2.11",
    "torchvision>=0.21,<=0.26",

    # Core PXDepth
    "numpy>=1.26",
    "einops>=0.8",
    "huggingface-hub>=0.28",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "scipy>=1.12",

    # CLI / inference / evaluation
    "click>=8.1",
    "tqdm>=4.66",
    "h5py>=3.10",
    "opencv-python>=4.10",
    "open3d>=0.18",
    "OpenEXR>=3.3",

    # Hugging Face / Gradio demo
    "gradio>=6.22,<7",
    "spaces",
    "trimesh>=4.5",

    # Geometry / pipeline
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@3fab839f0be9931dac7c8488eb0e1600c236e183",
    "pipeline @ git+https://github.com/EasternJournalist/pipeline.git@866f059d2a05cde05e4a52211ec5051fd5f276d6",

    # MoGe-2 reference model
    "moge @ git+https://github.com/microsoft/MoGe.git@42acd8f46e974f5e0548ecd72315d1d7df2cb6f4",
]

[project.urls]
Homepage = "https://yuanzhy29.github.io/PXDepth-Page/"
Repository = "https://github.com/yuanzhy29/PXDepth"
Paper = "https://arxiv.org/abs/2608.16984"
Model = "https://huggingface.co/yuanzhy29/PXDepth"

[tool.setuptools.packages.find]
where = ["."]
include = ["pxdepth*"]
exclude = [
    "configs*",
    "dataset_preprocess*",
    "docs*",
    "example_images*",
    "scripts*",
]
